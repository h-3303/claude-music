[project]
name = "claude-music-library"
version = "0.4.0"
description = "MCP server: playlist import (files, TIDAL, Deezer, YouTube Music), MusicBrainz resolution, local library diff, Soulseek matching and library tidying for claude-music"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "mcp>=2.2,<3",
    "mutagen>=1.47",
    "ytmusicapi>=1.8",
]

[project.scripts]
claude-music-library = "claude_music_library.server:main"
claude-music-tidy = "claude_music_library.tidy:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
