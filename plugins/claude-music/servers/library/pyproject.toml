[project]
name = "claude-music-library"
version = "0.1.0"
description = "MCP server: playlist import, MusicBrainz resolution, local library diff and Soulseek matching for claude-music"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "mcp>=2.2,<3",
    "mutagen>=1.47",
]

[project.scripts]
claude-music-library = "claude_music_library.server:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
