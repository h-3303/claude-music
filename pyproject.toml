# Development tooling for the repository (tests only; nothing here is installed by install.sh).
[project]
name = "claude-music-dev"
version = "0.0.0"
description = "Test tooling for the Nicotine+ MCP bridge and servers"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "anyio>=4",
    "mcp>=2.2,<3",
    "claude-music-library",
]

[tool.uv]
package = false

[tool.uv.sources]
claude-music-library = { path = "plugins/claude-music/servers/library", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 120
addopts = "-ra"
